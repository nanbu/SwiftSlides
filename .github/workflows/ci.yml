name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [macos-26, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: '6.4.0'
      - run: swift --version
      - run: swift test
      - run: swift build -c release
      - run: python3 scripts/verify-advanced-reading.py
      - run: python3 scripts/check-contract.py
      - run: python3 scripts/check-public-api.py
      - run: python3 scripts/build-feature-catalog.py --check
      - run: python3 scripts/build-capabilities.py --check
      - run: python3 scripts/check-public-content.py --history
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install python-pptx==1.0.2
      - run: python scripts/verify-interop.py
      - run: python scripts/verify-clone-interop.py
      - run: python scripts/verify-odp.py
      - run: python scripts/probe-keynote.py --self-test
